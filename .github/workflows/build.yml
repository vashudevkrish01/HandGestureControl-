
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Project
        run: unzip -o HandGestureControl.zip -d .

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download Model
        run: |
          mkdir -p HandGestureControl/app/src/main/assets
          curl -L --fail --retry 3 \
            'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task' \
            -o HandGestureControl/app/src/main/assets/hand_landmarker.task

      - name: Build APK
        working-directory: HandGestureControl
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HandGestureControl-APK
          path: HandGestureControl/app/build/outputs/apk/debug/app-debug.apk
          
